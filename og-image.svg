<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F5F1E8"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#2C2416" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Monogram -->
  <text x="600" y="280" font-family="'Playfair Display', Georgia, serif" font-size="160" font-weight="400" font-style="italic" fill="#2C2416" text-anchor="middle" dominant-baseline="middle">SR</text>

  <!-- Divider line -->
  <line x1="540" y1="340" x2="660" y2="340" stroke="#8B7355" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="600" y="400" font-family="'IBM Plex Mono', monospace" font-size="24" font-weight="400" fill="#8B7355" text-anchor="middle" letter-spacing="0.05em">Your build partner.</text>
</svg>