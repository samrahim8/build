<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #333; }
        .card {
            width: 1200px;
            height: 630px;
            background-color: #F5F1E8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(44,36,22,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(44,36,22,0.06) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .monogram {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 160px;
            font-style: italic;
            font-weight: 400;
            color: #2C2416;
            position: relative;
            z-index: 1;
            letter-spacing: -0.02em;
        }
        .divider {
            width: 120px;
            height: 1.5px;
            background: #8B7355;
            margin: 24px 0;
            position: relative;
            z-index: 1;
        }
        .tagline {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 24px;
            color: #8B7355;
            letter-spacing: 0.05em;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="monogram">SR</div>
        <div class="divider"></div>
        <div class="tagline">Your build partner.</div>
    </div>
</body>
</html>
