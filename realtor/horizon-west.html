function Counter({ end, duration = 1500, prefix = "", suffix = "" }) {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  useEffect(() => {
    const observer = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !started.current) {
        started.current = true;
        const start = performance.now();
        const animate = (now) => {
          const elapsed = now - start;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          setCount(Math.floor(eased * end));
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }
    }, { threshold: 0.3 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, [end, duration]);
  return <span ref={ref}>{prefix}{count.toLocaleString()}{suffix}</span>;
}

function FadeIn({ children, delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setVisible(true); }, { threshold: 0.1 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(30px)", transition: `opacity 0.7s ease ${delay}ms, transform 0.7s ease ${delay}ms` }}>
      {children}
    </div>
  );
}

function Checklist() {
  const [checked, setChecked] = useState({});

  const toggleCheck = (groupIdx, itemIdx) => {
    const key = `${groupIdx}-${itemIdx}`;
    setChecked(prev => ({ ...prev, [key]: !prev[key] }));
  };

  return (
    <div>
      {CHECKLIST_ITEMS.map((group, groupIdx) => (
        <div key={group.group} style={{ marginBottom: 32 }}>
          <h4 style={{
            fontFamily: "'DM Sans', sans-serif",
            fontSize: 14,
            fontWeight: 600,
            color: "#2D4A2D",
            marginBottom: 16,
            textTransform: "uppercase",
            letterSpacing: "1px",
          }}>
            {group.group}
          </h4>
          {group.items.map((item, itemIdx) => {
            const key = `${groupIdx}-${itemIdx}`;
            const isChecked = checked[key];
            return (
              <div
                key={itemIdx}
                onClick={() => toggleCheck(groupIdx, itemIdx)}
                style={{
                  display: "flex",
                  gap: 14,
                  padding: "14px 0",
                  borderBottom: "1px solid #EDE8E0",
                  cursor: "pointer",
                  opacity: isChecked ? 0.5 : 1,
                  transition: "opacity 0.2s",
                }}
              >
                <div style={{
                  width: 22,
                  height: 22,
                  border: "2px solid",
                  borderColor: isChecked ? "#2D4A2D" : "#D4C9B8",
                  borderRadius: 4,
                  background: isChecked ? "#2D4A2D" : "transparent",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  flexShrink: 0,
                  marginTop: 1,
                }}>
                  {isChecked && <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FEFCF8" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                </div>
                <span style={{
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 14,
                  lineHeight: 1.6,
                  color: "#5A5348",
                  textDecoration: isChecked ? "line-through" : "none",
                }}>
                  {item.text}
                </span>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

  // Budget: Match villages to price ranges they actually serve well
  // Lakeside: $387K–$1.1M+ | Bridgewater: $350K–$700K | Town Center: $450K–$1M+
  // Village F: $325K–$650K | Village H: $430K–$900K+ | Ovation: $400K–$800K
  budget: {
    "350-450": { villagef: 4, bridgewater: 3, ovation: 2 },  // Entry level - F and Bridgewater dominate
    "450-550": { ovation: 3, bridgewater: 3, villagef: 2, villageh: 2, towncenter: 1 },  // Ovation sweet spot
    "550-700": { towncenter: 3, villageh: 3, ovation: 2, bridgewater: 2, lakeside: 2 },  // Mid-premium range
    "700+": { lakeside: 4, towncenter: 3, villageh: 3 },  // Luxury - Lakeside has highest ceiling
  },
  // Household: Who lives where
  household: {
    "single": { towncenter: 4, villagef: 1 },  // Singles want walkability and nightlife
    "couple": { towncenter: 3, villageh: 2, villagef: 2, ovation: 1 },  // Couples want lifestyle + space options
    "young-kids": { bridgewater: 4, lakeside: 2, ovation: 2, villagef: 1 },  // Bridgewater = playgrounds everywhere
    "school-age": { bridgewater: 3, lakeside: 2, towncenter: 2, villageh: 1 },  // Schools + activities
    "teens": { towncenter: 3, lakeside: 2, bridgewater: 1 },  // Teens want things to do
    "empty-nest": { villageh: 3, towncenter: 3, villagef: 2, lakeside: 1 },  // Upscale quiet or walkable
  },
  // Commute: Actual drive times from each village
  // Disney: Ovation 7min, Village H 8min, Village F 10min, Bridgewater 12min, Town Center 12min, Lakeside 15min
  // Downtown: Lakeside 25min, Town Center 28min, Bridgewater 30min, Village F 30min, Village H 32min, Ovation 35min
  commute: {
    "disney": { ovation: 4, villageh: 3, villagef: 2, bridgewater: 1, towncenter: 1 },  // Ovation is closest
    "downtown": { lakeside: 3, towncenter: 3, bridgewater: 2, villagef: 1 },  // Lakeside/TC best for downtown
    "remote": { villagef: 2, ovation: 2, villageh: 2, towncenter: 2 },  // Nice views for home office
    "lake-nona": { lakeside: 2, bridgewater: 2, towncenter: 1 },  // Tough commute from anywhere
    "winter-garden": { lakeside: 4, bridgewater: 2, towncenter: 1 },  // Lakeside is right there
    "other": { towncenter: 1, lakeside: 1, bridgewater: 1 },  // Flexible/retired - slight bump for amenities
  },
  // Priority: What matters most to them
  priority: {
    "schools": { bridgewater: 4, lakeside: 2, towncenter: 2, villageh: 1 },  // Independence Elem is A-rated
    "walkability": { towncenter: 5 },  // Town Center is the only truly walkable option
    "new-construction": { ovation: 3, villageh: 3 },  // Both are newest villages
    "space": { villageh: 3, lakeside: 3, bridgewater: 2, ovation: 2, villagef: 1 },  // H has spacious lots, Lakeside has big established homes
    "disney-close": { ovation: 4, villageh: 3, villagef: 2 },  // Ovation is 7 min to western entrance
    "nature": { ovation: 4, villagef: 3, villageh: 2 },  // Ovation = conservation, Village F = trails/lakes
  },
};

                <div className="ft bf">{f.type}</div>
                <div className="fn">{f.name}</div>
                <div className="fno">{f.note}</div>
              </div>
            </div>
          </FadeIn>
        ))}
        {!showAllFood && (
          <div style={{ textAlign: "center" }}>
            <button className="smb" onClick={() => setShowAllFood(true)}>Show all {FOOD.length} spots</button>
          </div>
        )}
      </section>

      <div className="dl" />

      {/* ===== WHAT DOES $X GET YOU ===== */}
      <section className="sec" ref={(el) => (sectionRefs.current.budget = el)} id="budget">

          <div className="sl">Real Price Points</div>
          <h2 className="st">What does your budget<br /><em>actually buy?</em></h2>
          <p className="sd">I get this question constantly. Here's a straight answer — what your budget actually gets you out here.</p>
        </FadeIn>
        {PRICE_TIERS.map((tier, i) => (
          <FadeIn key={tier.range} delay={i * 80}>
            <div className="price-card">
              <div className="price-range">{tier.range}</div>
              <div className="price-vibe">{tier.vibe}</div>
              <div className="price-detail"><strong>Type:</strong> {tier.type}</div>
              <div className="price-detail"><strong>Size:</strong> {tier.size}</div>
              <div className="price-detail"><strong>Where:</strong> {tier.where}</div>
              <div className="price-reality">{tier.reality}</div>
            </div>
          </FadeIn>
        ))}
      </section>

      <div className="dl" />

        <FadeIn>
          <div className="sl">The Real Cost</div>
          <h2 className="st">HOAs: what you're<br /><em>actually paying</em></h2>
          <p className="sd">Yep, everywhere here has an HOA. Nobody loves paying them, but here's what you're looking at — and what you actually get.</p>
        </FadeIn>
        <FadeIn delay={100}>
          <table className="hoa-table">
            <thead>
              <tr>
                <th>Village</th>
                <th>Quarterly</th>
                <th>What's Included</th>
              </tr>
            </thead>
            <tbody>
              {HOA_DATA.map((row) => (
                <tr key={row.village}>
                  <td style={{ fontWeight: 500 }}>{row.village}</td>
                  <td style={{ color: "#2D4A2D", fontWeight: 500 }}>{row.range}</td>
                  <td>{row.included}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="hoa-mobile">
            {HOA_DATA.map((row) => (
              <div key={row.village} className="hoa-mobile-card">
                <div className="hoa-mobile-village">{row.village}</div>
                <div className="hoa-mobile-range">{row.range}/quarter</div>
                <div className="hoa-mobile-included">{row.included}</div>
              </div>
            ))}
          </div>
          <div className="hoa-note">
            <strong>CDD (Community Development District)</strong> fees are separate from HOA and fund infrastructure — roads, water management, parks. They're tax-deductible. Always ask for the TOTAL annual cost: HOA + CDD + property taxes. A $500K home in HW typically runs $8,000–$12,000/year all-in for taxes + HOA + CDD.
          </div>
        </FadeIn>
      </section>

      <div className="dl" />

      {/* ===== BUILDERS ===== */}
      <section className="sec">
        <FadeIn>
          <div className="sl">New Construction</div>
          <h2 className="st">Who's building<br /><em>in Horizon West</em></h2>
          <p className="sd">Builders are competing for buyers right now — most are offering closing cost credits, rate buydowns, or design upgrades. Here's who's active.</p>
        </FadeIn>
        <FadeIn delay={100}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(250px, 1fr))", gap: 12 }}>
            {BUILDERS.map((b) => (
              <div key={b.name} className="builder-card">
                <div className="builder-name">{b.name}</div>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#5A5348", marginBottom: 4 }}>{b.focus}</div>
                <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#A69E93" }}>{b.areas}</div>
              </div>
            ))}
          </div>
        </FadeIn>
        <FadeIn delay={200}>
          <div className="hoa-note" style={{ marginTop: 24 }}>
            <strong>A note on incentives:</strong> Most builders are offering something right now — closing cost credits, rate buydowns, design center allowances, or appliance packages. Incentives change monthly and vary by community. Always ask what's on the table, and have your agent negotiate on your behalf. Builders expect it.
          </div>
        </FadeIn>
      </section>

      {/* ===== ABOUT YOUR GUIDE ===== */}
      <section style={{ padding: "60px 24px", background: "#F5F2EC" }}>
        <div style={{ maxWidth: 700, margin: "0 auto", display: "flex", gap: 24, alignItems: "center", flexWrap: "wrap", justifyContent: "center" }}>
          <img src={AGENT.photo} alt={AGENT.name} style={{ width: 100, height: 100, borderRadius: "50%", objectFit: "cover", border: "3px solid #FEFCF8", boxShadow: "0 4px 12px rgba(0,0,0,0.1)" }} />
          <div style={{ flex: 1, minWidth: 280 }}>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, fontWeight: 500, letterSpacing: "2px", textTransform: "uppercase", color: "#2D4A2D", marginBottom: 8 }}>Your Local Realtor</div>
            <div style={{ fontFamily: "'Instrument Serif', Georgia, serif", fontSize: 22, color: "#1A1A18", marginBottom: 8 }}>{AGENT.name}</div>
            <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, lineHeight: 1.7, color: "#5A5348", marginBottom: 12 }}>
              I've lived in Horizon West for {AGENT.yearsInHW} years and helped {AGENT.transactionCount} families buy and sell here. If you have questions — about a neighborhood, a school, or just whether HW is right for you — I'm happy to help.
            </p>
            <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "#A69E93" }}>{AGENT.brokerage} · {AGENT.license}</div>
          </div>
        </div>
      </section>

      {/* ===== CTA #2 ===== */}
      <IntakeForm
        variant="compact"
        hook="Want to see what's actually available?"
        subtext="Give me your price range and I'll send you the stuff worth looking at — no fluff."
      />

      <div className="dl" />

      {/* ===== COMMUTES ===== */}
      <section className="sec" ref={(el) => (sectionRefs.current.moving = el)} id="moving">

          <div className="sl">Real Commute Times</div>
          <h2 className="st">How long it <em>actually</em><br />takes to get places</h2>
          <p className="sd">Real times, at 7:30am on a weekday. Not the optimistic Google Maps estimate from a Sunday afternoon.</p>
        </FadeIn>
        {COMMUTES.map((c, i) => (
          <FadeIn key={c.to} delay={i * 50}>
            <div className="cr">
              <div><div className="cto">{c.to}</div><div className="cru">{c.rush}</div></div>
              <div className="ctm">{c.time}</div>
            </div>
          </FadeIn>
        ))}
      </section>

      <div className="dl" />

      {/* ===== WHAT'S COMING ===== */}
      <section className="sec">
        <FadeIn>
          <div className="sl">What's Here + What's Coming</div>
          <h2 className="st">This area is still<br /><em>being built</em></h2>
          <p className="sd">This place is still being built out — which is part of the appeal. Here's what just opened and what's coming soon.</p>
        </FadeIn>
        {COMING_SOON.map((c, i) => (
          <FadeIn key={c.what} delay={i * 60}>
            <div className="cc">
              <span className={`cw ${c.status === "open" ? "cwo" : "cwb"}`}>{c.status === "open" ? "Now Open" : "Coming Soon"}</span>
              <div><div className="cwh">{c.what}</div><div className="cwd">{c.detail}</div></div>
            </div>
          </FadeIn>
        ))}
      </section>

      <div className="dl" />

      {/* ===== SAFETY ===== */}
      <section className="sec">
        <FadeIn>
          <div className="sl">Safety</div>
          <h2 className="st">Is Horizon West<br /><em>safe?</em></h2>
          <p className="sd">Short answer: yes. Here's the context.</p>
        </FadeIn>
        <FadeIn delay={100}>
          <div className="safety-prose">
            <p>
              Horizon West consistently ranks among the safest areas in Orange County. The area is patrolled by the Orange County Sheriff's Office, with a dedicated district covering the 34787 zip code. Violent crime is extremely rare — most reported incidents are property-related (car break-ins, package theft) and concentrated near commercial areas, not residential streets.
            </p>
            <p>
              Every village has well-lit streets, sidewalks on both sides, and most newer communities are gated or have controlled access points. The trail system is well-maintained and feels safe for evening walks and early morning runs.
            </p>
            <div className="safety-notes">
              <strong>A few practical notes:</strong>
              <ul>
                <li>Lock your car. Unlocked car break-ins are the #1 reported crime. It's opportunistic, not targeted.</li>
                <li>Package theft spikes around holidays. Most neighborhoods have adopted Ring/Nest cameras and active Nextdoor reporting.</li>
                <li>The OCSO non-emergency line is (407) 836-4357. Save it.</li>
                <li>There's no dedicated fire station yet, but Station 41 in Windermere and Station 82 near Four Corners serve the area. A new station is planned near the Regional Park.</li>
              </ul>
            </div>
            <p style={{ marginTop: 20 }}>
              Overall: families walk the trails at 9pm, kids ride bikes around the neighborhood, and nobody thinks twice about it. That's the vibe.
            </p>
          </div>
        </FadeIn>
      </section>

      <div className="dl" />

      {/* ===== NEW RESIDENT CHECKLIST ===== */}
      <section className="sec">
        <FadeIn>
          <div className="sl">Moving Checklist</div>
          <h2 className="st">Your first week in<br /><em>Horizon West</em></h2>
          <p className="sd">Everything you need to set up after you close. Bookmark this.</p>
        </FadeIn>
        <FadeIn delay={100}>
          <Checklist />
        </FadeIn>
      </section>

      <div className="dl" />

      {/* ===== DAYCARE & SCHOOLS ===== */}
      <section className="sec">
        <FadeIn>
          <div className="sl">Childcare & Private Schools</div>
          <h2 className="st">Daycare, preschool &<br /><em>private school</em> options</h2>
          <p className="sd">Here's what's in the area. Most have waitlists, so start calling early.</p>
        </FadeIn>
        {CHILDCARE.map((group, gi) => (
          <FadeIn key={group.category} delay={gi * 100}>
            <div className="childcare-group">
              <div className="childcare-label">{group.category}</div>
              {group.items.map((item, ii) => (
                <div key={item.name} className="childcare-card">
                  <div className="childcare-name">{item.name}</div>
                  <div className="childcare-meta">{item.ages} · {item.location}</div>
                  <div className="childcare-intel">{item.note}</div>
                </div>
              ))}
            </div>
          </FadeIn>
        ))}
              </section>

      <div className="dl" />

      {/* ===== COMMUNITY LINKS ===== */}
      <section className="sec" ref={(el) => (sectionRefs.current.community = el)} id="community">
        <FadeIn>
          <div className="sl">Plug In Before You Move</div>
          <h2 className="st">Join these groups<br /><em>before you get here</em></h2>
          <p className="sd">Join these before you move. The real intel comes from people who already live here — not Zillow comments.</p>
        </FadeIn>
        {COMMUNITY_LINKS.map((c, i) => (
          <FadeIn key={c.name} delay={i * 50}>
            <div className="clc">
              <div><div className="clt bf">{c.type}</div><div className="cln">{c.name}</div><div className="clno">{c.note}</div></div>
            </div>
          </FadeIn>
        ))}
      </section>

      {/* ===== CTA #3 (FULL FORM) ===== */}
      <IntakeForm
        variant="full"
        hook="Let me put something together for you"
        subtext="You've done your homework. Now let's get specific — tell me what you're looking for and I'll send you a plan that actually makes sense for your situation."
      />

            <footer style={{ padding: "48px 24px", background: "#1A1A18", color: "#FEFCF8" }}>
        <div style={{ maxWidth: 700, margin: "0 auto", textAlign: "center" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginBottom: 20 }}>
            <img src={AGENT.photo} alt={AGENT.name} style={{ width: 48, height: 48, borderRadius: "50%", objectFit: "cover" }} />
            <div style={{ textAlign: "left" }}>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 15, fontWeight: 500 }}>{AGENT.name}</div>
              <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "rgba(254,252,248,0.6)" }}>{AGENT.title}</div>
            </div>
          </div>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 14, marginBottom: 8 }}>
            <a href={`tel:${AGENT.phone}`} style={{ color: "#FEFCF8", textDecoration: "none" }}>{AGENT.phone}</a>
            <span style={{ margin: "0 12px", color: "rgba(254,252,248,0.3)" }}>·</span>
            <a href={`mailto:${AGENT.email}`} style={{ color: "#FEFCF8", textDecoration: "none" }}>{AGENT.email}</a>
          </div>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "rgba(254,252,248,0.5)", marginBottom: 24 }}>
            {AGENT.brokerage} · {AGENT.license}
          </div>
          <div style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 11, color: "rgba(254,252,248,0.4)", lineHeight: 1.7, maxWidth: 500, margin: "0 auto", marginBottom: 24 }}>
            Data from MLS, Orange County, OCPS & the residents of Horizon West. Information deemed reliable but not guaranteed. Equal Housing Opportunity.
          </div>
          <div style={{ borderTop: "1px solid rgba(254,252,248,0.1)", paddingTop: 20 }}>
            <a href="/realtor/" style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 13, color: "#D4A44C", textDecoration: "none", display: "block", marginBottom: 12 }}>
              Want a page like this for your market? →
            </a>
            <a href="https://popup.company" style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, color: "rgba(254,252,248,0.5)", textDecoration: "none" }}>
              Powered by <span style={{ color: "#D4A44C", fontWeight: 500 }}>POP-UP</span>
            </a>
          </div>
        </div>
      </footer>
    </div>
  );
}

root.render(<HorizonWestGuide />);
